name: Publish Python Package to PyPI

# Only allow one publish workflow per this repo/branch/tag at a time.
concurrency:
  group: "pypi-publish"
  cancel-in-progress: true

on:
  # 1) Publish automatically whenever a release tag (v...) is pushed.
  push:
    tags:
      - "v*"
  # 2) Allow a manual trigger from the Actions tab (used for the first upload).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run the byte-level verification suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the package with its declared runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
      - name: Smoke-test the installed import (outside the source tree)
        working-directory: /tmp
        run: python -c "import pyora; print('import pyora OK', pyora.__version__)"
      - name: Run offline verification suite
        working-directory: .
        run: |
          python -m tests.test_core

  build:
    name: Build distributions (sdist + wheel)
    needs: test
    runs-on: ubuntu-latest
    outputs:
      artifact: dist
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
      - name: Build wheel and source tarball
        run: python -m build
      - name: Store distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  publish:
    name: Upload to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      id-token: write # required for the trusted-publishing OIDC flow
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # Two equally valid options for credentials:
        #   A) Trusted publishing (recommended): PyPI -> account -> "Add a
        #      new publisher" for repo gjb711/pyora and environment "publish".
        #   B) API token: add a repository secret named PYPI_API_TOKEN.
        # Simply remove one of the `with:` secrets below to choose.
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
